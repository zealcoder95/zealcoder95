name: Refresh profile

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_profile.py'
      - 'tests/**'
      - 'profile-config.json'
      - 'assets/profile-project-sources.json'
      - 'assets/profile-source/**'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test update behavior
        run: python3 -m unittest discover -s tests -v
      - name: Refresh public project metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Publish changes when needed
        env:
          PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add README.md assets/profile-live.json assets/live
          if git diff --cached --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh profile projects and public metadata"
          git push origin "HEAD:${PROFILE_BRANCH}"
